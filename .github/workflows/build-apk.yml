name: Build Android APK (Pointage Prud'hommes)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurer Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Vérifier Android SDK pré-installé (API 34)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_BIN="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_BIN" ]; then
            yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
            "$SDK_BIN" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Installer les dépendances npm & construire l'app Web
        working-directory: .
        run: |
          npm install
          npm run build

      - name: Initialiser et synchroniser le projet Android Capacitor
        working-directory: .
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Injecter les permissions Android (Caméra, GPS, Réseau)
        working-directory: .
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.INTERNET" \
            "android.permission.ACCESS_NETWORK_STATE" \
            "android.permission.ACCESS_COARSE_LOCATION" \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.CAMERA"
          do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|<uses-permission android:name=\"$PERM\" />\n    <application|" "$MANIFEST"
            fi
          done

      - name: Compiler l'APK Android (Debug prêt à installer)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK téléchargeable en 1 clic
        uses: actions/upload-artifact@v4
        with:
          name: Pointage-Prudhommes-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
